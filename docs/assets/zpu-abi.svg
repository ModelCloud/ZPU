<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img"><defs><linearGradient id="g"><stop stop-color="#1fe6ff"/><stop offset="1" stop-color="#9a4cff"/></linearGradient></defs><rect width="1600" height="820" fill="#050811"/><text x="90" y="105" font-family="Inter,Arial" font-size="58" font-weight="900" fill="#fff">🤯 The wild part: 234 / 234 ✅</text><text x="90" y="165" font-family="Inter,Arial" font-size="34" font-weight="700" fill="#4be0ff">Every Vulkan 1.0–1.4 core command ABI has an entry point + verification path</text><rect x="85" y="235" width="1430" height="370" rx="28" fill="#0a1428" stroke="url(#g)" stroke-width="4"/><text x="145" y="410" font-family="Inter,Arial" font-size="128" font-weight="900" fill="url(#g)">234 / 234</text><text x="150" y="475" font-family="Inter,Arial" font-size="31" font-weight="700" fill="#dffaff">Core command ABIs covered</text><g font-family="Inter,Arial" font-size="31" font-weight="800" fill="#fff"><text x="930" y="315">1.0 — 137</text><text x="930" y="375">1.1 — 28</text><text x="930" y="435">1.2 — 13</text><text x="930" y="495">1.3 — 37</text><text x="930" y="555">1.4 — 19</text></g><g fill="url(#g)"><rect x="1160" y="285" width="250" height="32" rx="10"/><rect x="1160" y="345" width="82" height="32" rx="10"/><rect x="1160" y="405" width="52" height="32" rx="10"/><rect x="1160" y="465" width="105" height="32" rx="10"/><rect x="1160" y="525" width="65" height="32" rx="10"/></g><rect x="85" y="650" width="1430" height="105" rx="22" fill="#261a05" stroke="#ffb000" stroke-width="3"/><text x="800" y="695" text-anchor="middle" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#ffd36b">⚠ ABI coverage ≠ full Vulkan 1.4 feature set or CTS conformance</text><text x="800" y="730" text-anchor="middle" font-family="Inter,Arial" font-size="24" fill="#fff">ZPU reports a 1.4.360 ABI ceiling; runtime feature bits remain bounded and truthful.</text></svg>
