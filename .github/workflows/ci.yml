name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Enable arm64 APT multiarch sources
        run: |
          # GitHub's Ubuntu 24.04 Azure mirror does not publish arm64 indexes,
          # so restrict the default deb822 sources to amd64 and add the official
          # Ubuntu ports mirror for arm64 packages. Refs:
          # https://github.com/actions/runner-images/issues/10901
          # https://github.com/actions/runner-images/issues/12878
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          codename=$(lsb_release -cs)
          printf '%s\n' \
            "Types: deb" \
            "URIs: http://azure.ports.ubuntu.com/ubuntu-ports/" \
            "Suites: ${codename} ${codename}-updates ${codename}-security" \
            "Components: main restricted universe" \
            "Architectures: arm64" \
            | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null
          sudo dpkg --add-architecture arm64
      - name: Install reproducible Ubuntu coverage and Vulkan-loader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov libvulkan1 libvulkan-dev libxcb1-dev libxcb1-dev:arm64 libvulkan-dev:arm64 twm vulkan-tools xauth xvfb
          dpkg-query -W -f='${Package}=${Version}\n' kcov libvulkan1 libvulkan-dev libxcb1-dev libxcb1-dev:arm64 libvulkan-dev:arm64 twm vulkan-tools xauth xvfb
      - run: tools/limited-cpus.sh zig fmt --check build.zig src tools
      - run: tools/limited-cpus.sh zig build
      - run: test "$(realpath zig-out/share/vulkan/icd.d/../../../lib/libvulkan_zpu.so)" = "$(realpath zig-out/lib/libvulkan_zpu.so)"
      - run: tools/limited-cpus.sh zig build test
      - run: tools/limited-cpus.sh zig build behavior
      - run: tools/limited-cpus.sh zig build coverage
      - run: tools/limited-cpus.sh zig build smoke
      - name: Affinity/topology and explicit worker-cap proof
        run: |
          test/limited_cpus.sh
          test/observe_zig_threads.sh
      - name: Benchmark correctness, stable JSON schema, and in-run guard
        run: |
          tools/limited-cpus.sh zig build benchmark -Doptimize=ReleaseFast -- --smoke --json > benchmark.json
          python3 - <<'PY'
          import json
          r=json.load(open('benchmark.json'))
          checks = [
              (r['schema_version']==4 and r['workload_id']=='zpu-2d-kernels-v4-240x240-seed-151521030', 'schema/workload'),
              ({'clear','pixel_write','clipped_rectangle','vulkan_host_memory_fill','vulkan_host_memory_copy','source_over_blend','sprite_draw','frame'} == {m['name'] for m in r['metrics']}, 'operations'),
              (all(m['checksum'] and m['bytes_s'] > 0 and m['frame']['p50_ns'] <= m['frame']['p95_ns'] <= m['frame']['p99_ns'] for m in r['metrics']), 'metrics'),
              (r['fingerprint']['max_threads'] <= 8, 'thread cap'),
              (r['fingerprint']['compiler']=='0.16.0' and r['fingerprint']['build_mode']=='ReleaseFast', 'compiler/mode'),
          ]
          failed = [name for ok, name in checks if not ok]
          if failed: raise SystemExit('benchmark checks failed: ' + ', '.join(failed))
          if not any(m['backend']=='avx2' for m in r['metrics']):
              print('AVX2 execution unverified: x86-64-v3 kernel tier unavailable on this runner')
          PY
      - name: Authoritative system Vulkan-loader discovery
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          export VK_DRIVER_FILES="$PWD/zig-out/share/vulkan/icd.d/zpu_icd.x86_64.json"
          tools/limited-cpus.sh vulkaninfo --summary | tee vulkaninfo-summary.txt
          grep -F 'ZPU Experimental CPU' vulkaninfo-summary.txt
          grep -E 'deviceType[[:space:]]*=[[:space:]]*PHYSICAL_DEVICE_TYPE_CPU' vulkaninfo-summary.txt
          grep -E 'apiVersion[[:space:]]*=[[:space:]]*1\.0\.0' vulkaninfo-summary.txt
          grep -Ei 'vendorID[[:space:]]*=[[:space:]]*0x1cdc' vulkaninfo-summary.txt
          grep -Ei 'deviceID[[:space:]]*=[[:space:]]*0x0001' vulkaninfo-summary.txt
      - name: Exact 240x240 system-loader transfer validation
        run: tools/limited-cpus.sh zig build transfer
      - name: Require desktop/window-system readiness boundary
        run: tools/limited-cpus.sh zig build desktop-ready
      - name: Require canonical two-frame Xvfb vkcube compatibility
        run: tools/limited-cpus.sh zig build vkcube-ready
      - name: Require visible XCB swapchain pixels
        run: tools/limited-cpus.sh zig build xcb-present
      - name: Require captured vkcube draw pixels
        run: tools/limited-cpus.sh zig build vkcube-visual
      - name: Require vkcube inside a minimal desktop session
        run: tools/limited-cpus.sh zig build desktop-session
      - run: tools/limited-cpus.sh zig build demo
      - run: test "$(sha256sum zpu-demo.ppm | cut -d' ' -f1)" = "919b08ed95dec247b8c456e7fc1b85ac47e5a9d0030a54f6287fbfe424d37ef4"
      - run: tools/limited-cpus.sh zig build -Doptimize=ReleaseFast
      - name: Verify ICD ELF ABI
        run: |
          test "$(readelf -d zig-out/lib/libvulkan_zpu.so | awk '/NEEDED/ {print $5}' | sort)" = "$(printf '%s\n' '[ld-linux-x86-64.so.2]' '[libc.so.6]' '[libxcb.so.1]' | sort)"
          exports="$(readelf --dyn-syms --wide zig-out/lib/libvulkan_zpu.so | awk '$5 == "GLOBAL" && $7 != "UND" {print $8}')"
          test "$(printf '%s\n' "$exports" | wc -l)" -eq 3
          for symbol in vk_icdNegotiateLoaderICDInterfaceVersion vk_icdGetInstanceProcAddr vk_icdGetPhysicalDeviceProcAddr; do
            printf '%s\n' "$exports" | grep -qx "$symbol"
          done
