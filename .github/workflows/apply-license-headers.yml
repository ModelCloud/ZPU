name: Apply Apache-2.0 headers and README visuals

on:
  push:
    branches:
      - docs/zpu-branding-apache2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/zpu-branding-apache2
          fetch-depth: 0

      - name: Integrate README visuals
        run: python3 tools/apply-readme-visuals.py

      - name: Apply Apache-2.0 headers
        run: python3 tools/apply-license-headers.py

      - name: Commit generated repository updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "license/docs: apply Apache-2.0 headers and README visuals [skip ci]"
          git push origin HEAD:docs/zpu-branding-apache2
